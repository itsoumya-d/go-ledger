apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-ledger
  namespace: ledger
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-ledger
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
