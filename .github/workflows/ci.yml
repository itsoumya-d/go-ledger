name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t go-ledger:ci .

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [gcp, azure, aws]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive infra/terraform/${{ matrix.stack }}
      - name: Init and validate
        working-directory: infra/terraform/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
