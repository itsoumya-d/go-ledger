name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "statement coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c < 56.0) { print "coverage gate failed: " c "% < 56%"; exit 1 } }'
      - run: go vet ./...
      - run: go build ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t go-ledger:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run Cypress against the preview server
        run: |
          npm run preview -- --host 127.0.0.1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx cypress run
          kill $SERVER_PID

  db-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ledger
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client default-mysql-client
      - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ledger -c "SELECT 1"
      - run: mysql -h 127.0.0.1 -uroot -proot ledger -e "SELECT 1"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: PostgreSQL audit store integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ledger?sslmode=disable
        run: go test -race -run TestPostgresAuditStoreRoundTrip -v ./...

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [gcp, azure, aws]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive infra/terraform/${{ matrix.stack }}
      - name: Init and validate
        working-directory: infra/terraform/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
